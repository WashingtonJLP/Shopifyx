<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login - Shopifyx</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="login.js"></script>

</head>

<body>

<div class="login-wrapper">
  <div class="login-card">

    <h2 class="titulo">SHOPIFYX</h2>
    <p class="subtitulo">Acesso ao painel administrativo</p>

    <form id="loginForm">

      <div class="input-group mb-3">
        <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
        <input type="text" id="nome" class="form-control" placeholder="Usuário" required>
      </div>

      <div class="input-group mb-3">
  <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>

  <input type="password" id="senha" class="form-control" placeholder="Senha" required>

  <span class="input-group-text" id="toggleSenha" style="cursor: pointer;">
    <i class="bi bi-eye-fill" id="iconSenha"></i>
  </span>
</div>

      <button class="btn btn-primary w-100 mt-2 botao-login" type="submit">
        Entrar
      </button>

      <p id="erro" class="erro mt-3"></p>

    </form>

  </div>
</div>

<script src="login.js"></script>
</body>
</html>
